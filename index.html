<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Library Management System</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="app-header">
    <h1>📚 Library Management System</h1>
    <p>Add, view, search and delete book records</p>
  </header>

  <main class="container">

    <!-- Add Book Form -->
    <section class="card">
      <h2>Add Book</h2>
      <form id="bookForm">
        <div class="form-row">
          <label for="title">Book Title</label>
          <input type="text" id="title" required placeholder="e.g. The Alchemist" />
        </div>
        <div class="form-row">
          <label for="author">Author</label>
          <input type="text" id="author" required placeholder="e.g. Paulo Coelho" />
        </div>
        <div class="form-row">
          <label for="genre">Genre</label>
          <input type="text" id="genre" required placeholder="e.g. Fiction" />
        </div>
        <div class="form-row">
          <label for="copies">Copies Available</label>
          <input type="number" id="copies" min="0" required placeholder="e.g. 5" />
        </div>
        <button type="submit" class="btn-primary">Add Book</button>
      </form>
    </section>

    <!-- Search Book -->
    <section class="card">
      <h2>Search Book</h2>
      <div class="form-row search-row">
        <input type="text" id="searchInput" placeholder="Search by title or author..." />
        <button id="searchBtn" class="btn-secondary">Search</button>
        <button id="clearSearchBtn" class="btn-ghost">Clear</button>
      </div>
    </section>

    <!-- Book List -->
    <section class="card">
      <h2>Book Records</h2>
      <div id="bookList" class="book-list"></div>
      <p id="emptyMsg" class="empty-msg" hidden>No books found. Add a book to get started.</p>
    </section>

  </main>

  <footer class="app-footer">
    <p>Library Management System &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
