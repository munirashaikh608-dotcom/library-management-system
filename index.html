<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eventra — Event Management System</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">◐</span>
      <span class="brand-name">Eventra</span>
    </div>
    <p class="brand-tag">Event Management System</p>
  </header>

  <main class="wrap">

    <!-- ADD EVENT -->
    <section class="panel panel-form" aria-labelledby="form-title">
      <div class="panel-head">
        <span class="eyebrow">01 — Create</span>
        <h2 id="form-title">Add an event</h2>
      </div>

      <form id="event-form" novalidate>
        <div class="field">
          <label for="ev-name">Event name</label>
          <input type="text" id="ev-name" placeholder="e.g. Annual Tech Fest" required>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="ev-date">Date</label>
            <input type="date" id="ev-date" required>
          </div>
          <div class="field">
            <label for="ev-time">Time</label>
            <input type="time" id="ev-time">
          </div>
        </div>

        <div class="field">
          <label for="ev-venue">Venue</label>
          <input type="text" id="ev-venue" placeholder="e.g. Main Auditorium">
        </div>

        <div class="field">
          <label for="ev-category">Category</label>
          <select id="ev-category">
            <option value="General">General</option>
            <option value="Workshop">Workshop</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
            <option value="Seminar">Seminar</option>
          </select>
        </div>

        <div class="field">
          <label for="ev-desc">Description</label>
          <textarea id="ev-desc" rows="3" placeholder="Short details about the event"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Add event</button>
        <p class="form-msg" id="form-msg" role="status"></p>
      </form>
    </section>

    <!-- LIST + SEARCH -->
    <section class="panel panel-list" aria-labelledby="list-title">
      <div class="panel-head panel-head-row">
        <div>
          <span class="eyebrow">02 — Manage</span>
          <h2 id="list-title">Your events</h2>
        </div>
        <span class="count-badge" id="event-count">0 events</span>
      </div>

      <div class="search-row">
        <input type="search" id="search-input" placeholder="Search by name, venue, or category…">
        <select id="sort-select">
          <option value="date-asc">Soonest first</option>
          <option value="date-desc">Latest first</option>
          <option value="name-asc">Name A–Z</option>
        </select>
      </div>

      <div id="event-list" class="event-list">
        <!-- event cards injected here -->
      </div>

      <div id="empty-state" class="empty-state">
        <span class="empty-glyph">✦</span>
        <p>No events yet — add your first one on the left.</p>
      </div>
    </section>

  </main>

  <!-- Event detail / delete confirm modal -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
      <p class="eyebrow" id="modal-eyebrow">Event</p>
      <h3 id="modal-title"></h3>
      <dl class="modal-meta" id="modal-meta"></dl>
      <p id="modal-desc" class="modal-desc"></p>
      <div class="modal-actions">
        <button class="btn btn-danger" id="modal-delete">Delete event</button>
        <button class="btn btn-ghost" id="modal-cancel">Close</button>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>Eventra · built with HTML, CSS &amp; JavaScript</p>
  </footer>

<script src="script.js"></script>
</body>
</html>
